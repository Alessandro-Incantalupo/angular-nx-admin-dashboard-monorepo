name: ci

# Every push and pull request: format, lint, types, tests and builds. No
# secrets: the API tests run on an in-memory Postgres (PGlite).
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # Node and pnpm from mise.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm exec nx run-many -t lint typecheck
      - run: pnpm exec nx run-many -t test
      - run: pnpm exec nx run-many -t build
      - run: node tools/check-csp.mjs
      # Known vulnerabilities in what ships (dev tooling excluded).
      - run: pnpm audit --prod --audit-level high
