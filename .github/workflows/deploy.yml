name: deploy

# Runs only on main. The front end is deployed by Vercel's Git integration;
# this workflow ships the API to DigitalOcean App Platform:
#   1. apply the database migrations (owner role),
#   2. build the bundle and push the image the App Platform app pulls,
#   3. reset the public demo workspace (members, activity, demo login).
#
# Secrets: DIGITALOCEAN_ACCESS_TOKEN, MIGRATION_DATABASE_URL,
# BETTER_AUTH_SECRET, FRONTEND_ORIGIN, SEED_ADMIN_PASSWORD.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'libs/models/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: registry.digitalocean.com/admin-api-registry-v1/admin-api

jobs:
  api:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx test api

      - name: Apply migrations
        run: pnpm exec nx run api:db-migrate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      - name: Build the bundle and the image
        run: |
          pnpm exec nx build api
          docker build -f apps/api/Dockerfile -t "$IMAGE:${GITHUB_SHA::12}" -t "$IMAGE:latest" .

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # App Platform redeploys when the `latest` tag changes.
      - name: Push the image
        run: |
          doctl registry login --expiry-seconds 600
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"

      - name: Reset the demo workspace
        run: pnpm exec nx run api:db-seed
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
