<div class="text-center">
  <div class="flex flex-col items-center">
    <img
      class="h-24 w-24 rounded-full"
      alt="User Avatar"
      width="96"
      height="96"
      [ngSrc]="avatarUrl()"
    />
    <h2 class="text-color-foreground mt-4 text-2xl font-semibold">
      {{ userName() }}
    </h2>
    <p class="text-color-muted-foreground text-sm">{{ email() }}</p>
    <p class="text-color-muted-foreground text-sm font-medium">
      {{ userRole() }}
    </p>
  </div>
</div>
