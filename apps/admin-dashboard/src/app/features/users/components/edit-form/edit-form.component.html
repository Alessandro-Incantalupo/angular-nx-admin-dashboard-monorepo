<ng-container *transloco="let t; prefix: 'users'">
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="space-y-4 rounded border border-gray-300 bg-white p-6 shadow-md"
  >
    <input
      class="w-full rounded border px-3 py-2 text-black"
      formControlName="name"
      [placeholder]="t('form.name-placeholder')"
    />
    <input
      class="w-full rounded border px-3 py-2"
      formControlName="email"
      [placeholder]="t('form.email-placeholder')"
      type="email"
    />
    <select class="w-full rounded border px-3 py-2" formControlName="role">
      <option value="user">{{ t('role-selector.user') }}</option>
      <option value="admin">{{ t('role-selector.admin') }}</option>
      <option value="guest">{{ t('role-selector.guest') }}</option>
    </select>
    <select class="w-full rounded border px-3 py-2" formControlName="status">
      <option value="active">{{ t('form.status-active') }}</option>
      <option value="inactive">{{ t('form.status-inactive') }}</option>
    </select>
    <div class="flex gap-2 pt-2">
      <button
        type="submit"
        class="rounded bg-green-600 px-4 py-2 text-white hover:bg-green-700"
      >
        {{ t('form.save') }}
      </button>
      <button
        type="button"
        class="rounded bg-gray-300 px-4 py-2"
        (click)="onCancel()"
      >
        {{ t('form.cancel') }}
      </button>
    </div>
  </form>
</ng-container>
