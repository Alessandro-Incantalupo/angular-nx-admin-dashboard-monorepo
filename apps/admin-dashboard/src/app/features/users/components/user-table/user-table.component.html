<ng-container *transloco="let t; prefix: 'users'">
  <div
    class="border-muted/20 bg-background flex min-w-full flex-col overflow-x-auto rounded-xl border p-2 shadow-md"
  >
    <table
      class="text-color-muted-foreground min-w-full table-auto border-collapse border-0 text-left align-middle leading-5"
    >
      <thead class="bg-primary text-primary-foreground text-xs">
        <tr>
          <th
            class="text-color-foreground border-b p-3 text-left font-semibold"
          >
            {{ t('table.name') }}
          </th>
          <th
            class="text-color-foreground border-b p-3 text-left font-semibold"
          >
            {{ t('table.email') }}
          </th>
          <th
            class="text-color-foreground border-b p-3 text-left font-semibold"
          >
            {{ t('table.role') }}
          </th>
          <th
            class="text-color-foreground border-b p-3 text-left font-semibold"
          >
            {{ t('table.actions') }}
          </th>
        </tr>
      </thead>
      <tbody>
        @for (user of users(); track user.id) {
          <tr class="hover:bg-card/50">
            <td class="border-b p-3">{{ user.name || '-' }}</td>
            <td class="border-b p-3">{{ user.email || '-' }}</td>
            <td class="border-b p-3 capitalize">{{ user.role || '-' }}</td>

            <td class="space-x-2 border-b p-3">
              @if (!readOnly()) {
                <button
                  class="bg-primary text-primary-foreground hover:bg-primary/90 rounded-md px-3 py-1 text-xs font-semibold"
                  (click)="editAction.emit(user)"
                >
                  {{ t('table.edit') }}
                </button>
                <button
                  class="rounded-md bg-red-600 px-3 py-1 text-xs font-semibold text-white hover:bg-red-700"
                  (click)="deleteAction.emit(user)"
                >
                  {{ t('table.delete') }}
                </button>
              } @else {
                <span class="text-color-muted-foreground text-xs">{{
                  t('table.view-only')
                }}</span>
              }
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-color-muted-foreground p-6 text-center">
              {{ t('empty') }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</ng-container>
