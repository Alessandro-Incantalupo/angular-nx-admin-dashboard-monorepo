<div *transloco="let t">
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-primary text-2xl font-bold">
      {{ t('users.title') }}
    </h1>
    <button
      class="bg-primary hover:bg-primary/90 focus:ring-primary/50 text-color-foreground transform rounded px-6 py-3 font-medium shadow-md transition-transform hover:scale-105 focus:ring-2"
      (click)="userStore.resetDemoData()"
      type="button"
    >
      ♻️ {{ t('users.reset-demo') }}
    </button>
  </div>

  <app-user-abilities
    [roleDescription]="authStore.roleDescription()"
    [isAuthenticated]="authStore.isAuthenticated()"
    (whatIsMyRole)="quickLogin($event)"
  ></app-user-abilities>

  <app-role-selector
    [isAuthenticated]="authStore.isAuthenticated()"
    [isGuest]="authStore.isGuest()"
    [isUser]="authStore.isUser()"
    [isAdmin]="authStore.isAdmin()"
    (whatIsMyRole)="authStore.setRole($event)"
  ></app-role-selector>

  @if (userStore.usersLoading()) {
    <p>{{ t('users.loading') }}</p>
  } @else if (userStore.usersError()) {
    <p class="text-red-500">{{ t('users.error') }}</p>
  } @else {
    @if (userStore.hasUsers()) {
      <div class="flex flex-col">
        <!-- Role-based description -->

        <!-- <app-role-description [hasError]="!!authStore.error()">
          @if (!authStore.error()) {
            <span class="text-primary">{{ authStore.roleDescription() }}</span>
          } @else {
            <span class="text-primary">Error loading role description</span>
          }
        </app-role-description> -->

        <!-- <app-tab
          [tabs]="tabs()"
          [activeTab]="activeTab()"
          (tabChange)="activeTab.set($event)"
        >
          @if (activeTab() === 'Tab 1') {
            <div class="p-4">
              <p>Content for Tab 1 goes here...</p>
            </div>
          }
          @if (activeTab() === 'Tab 2') {
            <div class="p-4">
              <p>Content for Tab 2 goes here...</p>
            </div>
          }
          @if (activeTab() === 'Tab 3') {
            <div class="p-4">
              <p>Content for Tab 3 goes here...</p>
            </div>
          }
        </app-tab> -->
        <app-prime-ng-table
          [users]="userStore.users()"
          [roles]="roles"
          [readOnly]="!authStore.canEdit()"
          [totalUsers]="userStore.totalItems()"
          [pageSize]="userStore.pageSize()"
          [currentPage]="userStore.currentPage()"
          (editAction)="onEdit($event)"
          (deleteAction)="onDelete($event)"
          (saveAction)="onRowEditSave($event)"
          (saveActionCancel)="onRowEditCancel($event)"
          (pageChangeAction)="onPageChange($event)"
        ></app-prime-ng-table>

        <!-- Admin-only form - Only show if authenticated and admin -->
        @if (authStore.canCreate()) {
          <div class="mt-6 flex justify-end">
            <button
              class="bg-primary hover:bg-primary/90 focus:ring-primary/50 text-color-foreground transform rounded px-6 py-3 font-medium shadow-md transition-transform hover:scale-105 focus:ring-2 focus:outline-none"
              (click)="showForm.set(true)"
            >
              ➕ {{ t('users.addUser') }}
            </button>
          </div>

          <!-- PrimeNG Dialog -->
          <p-dialog
            [header]="t('users.addUserForm')"
            [(visible)]="showForm"
            [modal]="true"
            [style]="{ 'max-width': '600px', width: '90vw' }"
            [draggable]="false"
            [resizable]="false"
            [closable]="true"
          >
            <!-- Toggle Form Type -->
            <div class="mb-4 flex gap-2">
              <button
                (click)="useSignalForm.set(true)"
                [class.bg-primary]="useSignalForm()"
                [class.text-white]="useSignalForm()"
                [class.bg-muted]="!useSignalForm()"
                class="focus:ring-primary/50 transform rounded px-4 py-2 text-sm font-medium shadow-sm transition-all hover:scale-105 hover:shadow-md focus:ring-2 focus:outline-none"
              >
                {{ t('users.form.signal') }}
              </button>
              <button
                (click)="useSignalForm.set(false)"
                [class.bg-primary]="!useSignalForm()"
                [class.text-white]="!useSignalForm()"
                [class.bg-muted]="useSignalForm()"
                class="focus:ring-primary/50 transform rounded px-4 py-2 text-sm font-medium shadow-sm transition-all hover:scale-105 hover:shadow-md focus:ring-2 focus:outline-none"
              >
                {{ t('users.form.reactive') }}
              </button>
            </div>

            @if (useSignalForm()) {
              <app-user-form-signal
                class="block"
                (isSubmitted)="showForm.set(false)"
              ></app-user-form-signal>
            } @else {
              <app-user-form
                class="block"
                (isSubmitted)="showForm.set(false)"
              ></app-user-form>
            }
          </p-dialog>
        }
      </div>
    } @else {
      <p>{{ t('users.empty') }}</p>
    }
  }
</div>
