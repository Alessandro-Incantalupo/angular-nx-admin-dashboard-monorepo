<nav
  *transloco="let t"
  [class]="menuStore.showSidebar() ? 'w-52 xl:w-64' : 'w-[70px]'"
  class="scrollbar-thumb--sm scrollbar-track-rounded bg-background scrollbar-thin scrollbar-track-transparent scrollbar-thumb-card hidden h-full flex-col justify-between overflow-auto pt-3 transition-all duration-300 lg:flex"
>
  <div class="px-4">
    <!-- Logo -->
    <div class="relative h-10">
      @if (menuStore.showSidebar()) {
        <div class="flex items-center">
          <a
            (click)="toggleSidebar()"
            class="bg-primary flex cursor-pointer items-center justify-center rounded-sm p-2 focus:ring-1 focus:outline-hidden"
          >
            <svg-icon src="assets/icons/logo.svg"></svg-icon>
          </a>
          <b class="text-color-foreground ml-1 pl-2 text-sm font-bold">
            {{ appJson.name }}
          </b>
        </div>
      }
      <button
        (click)="toggleSidebar()"
        class="text-color-muted-foreground/50 hover:text-color-muted-foreground absolute top-2 right-2 flex h-5 w-5 items-center justify-center rounded-sm transition-all duration-200 focus:outline-hidden"
        [class]="{ 'rotate-180': !menuStore.showSidebar() }"
      >
        <svg-icon
          src="assets/icons/heroicons/solid/chevron-double-left.svg"
        ></svg-icon>
      </button>
    </div>

    <!-- Separator -->
    <div class="pt-3">
      <hr class="border-muted border-dashed" />
    </div>

    <!-- Menu Items -->

    <app-sidebar-menu />
  </div>

  <div class="mx-4 my-4 space-y-1">
    <!-- Version -->
    <a
      target="_blank"
      [href]="t('general.github-page')"
      class="-sm hover:bg-card group flex h-9 cursor-pointer items-center justify-start p-2"
    >
      <svg-icon
        src="assets/icons/heroicons/outline/information-circle.svg"
        [svgClass]="'h-5 w-5 text-color-muted-foreground/50'"
      >
      </svg-icon>

      <div
        class="ml-3 truncate text-[10px] font-semibold tracking-wide focus:outline-hidden"
      >
        <span class="-sm-lg bg-primary/10 text-primary px-2 font-semibold">
          v{{ appJson.version }}
        </span>
      </div>

      @if (!menuStore.showSidebar()) {
        <div class="fixed w-full">
          <span
            class="-sm-md bg-foreground text-background absolute -top-4 left-12 z-1 w-auto min-w-max origin-left scale-0 p-2 text-xs font-bold shadow-md transition-all duration-200 group-hover:scale-100"
          >
            v{{ appJson.version }}
          </span>
        </div>
      }
    </a>
  </div>
</nav>
