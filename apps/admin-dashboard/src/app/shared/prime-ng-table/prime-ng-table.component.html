<div class="card">
  <p-toast />
  <p-table
    dataKey="id"
    editMode="row"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [value]="users()"
    [tableStyle]="{ 'min-width': '50rem' }"
    [rows]="5"
    [paginator]="false"
    [showCurrentPageReport]="false"
    [totalRecords]="totalUsers()"
  >
    <ng-template #header>
      <tr>
        <th style="width: 25%">Name</th>
        <th style="width: 25%">Email</th>
        <th style="width: 10%">Role</th>
        <th style="width: 10%">Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-user let-editing="editing" let-ri="rowIndex">
      <tr [pEditableRow]="user">
        <td>
          <p-cellEditor>
            <ng-template #input>
              <input pInputText type="text" required [(ngModel)]="user.name" />
            </ng-template>
            <ng-template #output>
              {{ user.name }}
            </ng-template>
          </p-cellEditor>
        </td>
        <td>
          <p-cellEditor>
            <ng-template #input>
              <input
                pInputText
                type="email"
                required
                [(ngModel)]="user.email"
              />
            </ng-template>
            <ng-template #output>
              {{ user.email }}
            </ng-template>
          </p-cellEditor>
        </td>
        <td>
          <p-cellEditor>
            <ng-template #input>
              <p-select
                appendTo="body"
                [options]="roles()"
                [style]="{ width: '100%' }"
                [(ngModel)]="user.role"
              />
            </ng-template>
            <ng-template #output>
              {{ user.role | titlecase }}
            </ng-template>
          </p-cellEditor>
        </td>
        <td>
          <div class="align-items-center flex items-end justify-center gap-2">
            @if (!editing && !readOnly()) {
              <button
                pButton
                pRipple
                type="button"
                pInitEditableRow
                icon="pi pi-pencil"
                text
                rounded
                severity="secondary"
                (click)="editAction.emit(user)"
              ></button>
              <button
                pButton
                pRipple
                type="button"
                icon="pi pi-trash"
                text
                rounded
                severity="danger"
                pTooltip="Delete user"
                tooltipPosition="top"
                (click)="deleteAction.emit({ user: user, index: ri })"
              ></button>
            }

            @if (editing && !readOnly()) {
              <button
                pButton
                pRipple
                type="button"
                pSaveEditableRow
                icon="pi pi-check"
                text
                rounded
                severity="secondary"
                (click)="saveAction.emit(user)"
              ></button>
            }

            @if (editing) {
              <button
                pButton
                pRipple
                type="button"
                pCancelEditableRow
                icon="pi pi-times"
                text
                rounded
                severity="secondary"
                (click)="saveActionCancel.emit({ user: user, index: ri })"
              ></button>
            }
          </div>

          @if (readOnly()) {
            <span
              class="text-color-muted-foreground align-items-center flex justify-center text-xs"
              >View Only</span
            >
          }
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-paginator
    class="mt-4"
    [rows]="pageSize()"
    [totalRecords]="totalUsers()"
    [rowsPerPageOptions]="[5, 10]"
    (onPageChange)="onPage($event)"
  />
</div>
