# App Platform spec for the API, as `doctl apps update <app id> --spec <file>`
# would apply it. Secret values are set in the DigitalOcean console (or with
# `doctl`), never in this file.
name: nx-angular-admin
region: fra
services:
  - name: admin-api
    image:
      registry_type: DOCR
      registry: admin-api-registry-v1
      repository: admin-api
      tag: latest
      deploy_on_push:
        enabled: true
    # No run_command: the image's CMD starts `node main.mjs`.
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - { key: PORT, value: '3000' }
      - { key: NODE_ENV, value: production }
      # The app's own role through Neon's pooled endpoint (host ends in -pooler).
      - { key: DATABASE_URL, type: SECRET, value: '<set in the console>' }
      - { key: DATABASE_POOL_MAX, value: '5' }
      - { key: BETTER_AUTH_SECRET, type: SECRET, value: '<set in the console>' }
      # The front end's origin: the browser reaches the API through its /api rewrite.
      - {
          key: FRONTEND_ORIGIN,
          value: 'https://admin-dashboard-nx-monorepo.vercel.app',
        }
      # Vercel's rewrite and App Platform's load balancer both add to X-Forwarded-For.
      - { key: TRUSTED_PROXY_HOPS, value: '2' }
