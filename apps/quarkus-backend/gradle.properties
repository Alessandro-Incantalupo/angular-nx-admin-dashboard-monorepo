# =============================================================================
# Gradle Properties: The Version Master (Level 1a)
# =============================================================================
# This file is your "Single Source of Truth" for versions.
# Change a version here, and it updates everywhere in the build system.

# Quarkus Platform Configuration
quarkusPluginId=io.quarkus
quarkusPluginVersion=3.32.2
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.32.2

# 🛠️ Dependency Versions: Centralized for easy updates
spotlessVersion=8.3.0
googleJavaFormatVersion=1.28.0
mcpServerHttpVersion=1.10.2
mapstructVersion=1.6.3
hibernateValidatorVersion=3.32.2
resteasyProblemVersion=3.32.1
liquibaseVersion=3.0.2
liquibaseCoreVersion=4.27.0
archunitJunit5Version=1.4.0
gitPropertiesPluginVersion=2.5.0
sonarqubePluginVersion=6.1.0.5360
checkstyleVersion=10.23.0
modernizerPluginVersion=1.12.0

# 🚀 Performance Tuning: Making Gradle "Supersonic"
# The daemon improves startup time (enabled by default in Gradle 3+)
org.gradle.daemon=true
# Parallel mode builds modules at the same time
org.gradle.parallel=true
# Selective configuration for faster builds in large projects
org.gradle.configureondemand=true

# 🧪 JVM Configuration: Required for Spotless on Java 16+
# These flags grant the formatter access to internal Java compiler APIs.
org.gradle.jvmargs=--add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-opens jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-opens jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
