quarkus.http.port=8081

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4300
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Custom

# MCP Configuration (Optional, defaults are usually fine for dev mode)
# quarkus.mcp.server.path=/q/dev-mcp
