# =============================================================================
# Application Properties: The Runtime Control (Level 1c)
# =============================================================================
# This file controls how the app behaves while it's running.
# Use the '%' prefix for profile-specific overrides (e.g., %dev. or %prod.)

# 🏠 General Configuration
application.name=admindashboard

# 🔌 Networking (Profiles)
# Local dev runs on 8081; Production usually runs on standard 8080
%dev.quarkus.http.port=8081
%prod.quarkus.http.port=8080

# 🌐 CORS Configuration: Safety first!
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:4300
# IMPORTANT: Update this with your real production domain before deploying!
%prod.quarkus.http.cors.origins=https://admin.yourdomain.com
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Custom

# 🗄️ Database Configuration (Profiles)
# In %dev, Quarkus 'Dev Services' will automatically start a Postgres container via Docker.
# In %prod, we point to the real production database.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://db.prod:5432/admindashboard
%prod.quarkus.datasource.username=admindashboard
%prod.quarkus.datasource.password=password

# 🏗️ Hibernate Configuration
# Level 3 Transition: We move from 'update' (The Renovator) to 'none' (The Professional).
# Liquibase will now handle all database structure changes.
quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.database.generation=none

# ⏱️ Liquibase Configuration (The Time Machine)
# This tells Quarkus to check for new database changes every time it starts.
quarkus.liquibase.migrate-at-start=true
# The 'Master' file that lists all your database versions.
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

# Disable SQL logging in production to keep logs clean and fast
%prod.quarkus.hibernate-orm.log.sql=false

# 🩺 Health & Metrics (Observability)
# These paths allow Kubernetes or Dashboards to monitor the app's pulse.
quarkus.smallrye-health.root-path=/management/health
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/management/prometheus

# 📖 OpenAPI & Swagger UI (API Documentation)
# Swagger UI is the interactive "playground" for testing your API.
quarkus.smallrye-openapi.path=/v2/api-docs
quarkus.swagger-ui.path=/swagger-ui
# Always include Swagger UI for easier development and debugging.
quarkus.swagger-ui.always-include=true

