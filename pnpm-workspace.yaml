packages:
  - apps/*
  - libs/*

# pnpm runs dependency build scripts only for the packages listed here.
allowBuilds:
  esbuild: true
  '@swc/core': true
  nx: true
  lmdb: true
  msgpackr-extract: true
  '@parcel/watcher': true
  less: false
  unrs-resolver: false

# The design tokens package is ours: install new releases without waiting out the release age.
minimumReleaseAgeExclude:
  - '@a.incantalupo/*'
  - '@hono/node-server@2.1.11'
